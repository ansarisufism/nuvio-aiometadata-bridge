services:
  - type: web
    name: nuvio-aiometadata-bridge
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MDBLIST_API_KEY
        sync: false
      - key: TMDB_API_KEY
        sync: false
